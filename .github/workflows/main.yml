name: Auto Update Menu Data

on:
  # ① 定期実行のスケジュール設定 (UTC時間で指定)
  # 下記は毎日 日本時間 午前6:00 (UTC 21:00) に実行する設定
  schedule:
    - cron: '0 21 * * *'
  
  # ② GitHubの画面上から手動で実行できるようにする設定
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードを仮想マシンに持ってくる
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pythonの環境をセットアップする
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 使用しているPythonのバージョンに合わせる

      # 3. 必要なライブラリをインストールする
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. スクレイピングのPythonスクリプトを実行する
      - name: Run scraping script
        run: python update_menu.py

      # 5. CSVに差分があればコミットしてプッシュする
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add menu_data.csv
          # 差分がある場合のみコミットする（エラー回避）
          git diff --staged --quiet || git commit -m "Auto-update menu_data.csv"
          git push
